plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alekss.toolkit'
    compileSdk 34

    defaultConfig {
        applicationId "com.alekss.toolkit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                          'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0',
                          'META-INF/*.kotlin_module', 'META-INF/INDEX.LIST',
                          'META-INF/services/javax.annotation.processing.Processor']
        }
    }
}

dependencies {
    implementation('org.smali:dexlib2:2.5.2') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
    }
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.android.support:multidex:1.0.3'
}
