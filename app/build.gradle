plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alekss.toolkit'
    compileSdk 34

    defaultConfig {
        applicationId "com.alekss.toolkit"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                'META-INF/services/javax.annotation.processing.Processor',
                'META-INF/services/org.xmlpull.v1.XmlPullParserFactory',
                'smali.properties',
                'baksmali.properties',
                '**/smali.properties',
                '**/baksmali.properties',
                'META-INF/MANIFEST.MF',
                'META-INF/*.MF'
            ]
        }
    }
}

dependencies {
    implementation 'org.apktool:apktool-lib:2.9.3'
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.google.guava:guava:31.1-android'

    implementation 'io.github.skylot:jadx-core:1.5.6'
    implementation 'io.github.skylot:jadx-dex-input:1.5.6'
    implementation 'io.github.skylot:jadx-java-input:1.5.6'

    implementation 'com.android.support:multidex:1.0.3'
}
