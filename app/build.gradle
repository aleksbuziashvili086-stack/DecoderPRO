plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alekss.toolkit'
    compileSdk 34

    defaultConfig {
        applicationId "com.alekss.toolkit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                'META-INF/services/javax.annotation.processing.Processor',
                'META-INF/services/org.xmlpull.v1.XmlPullParserFactory'
            ]
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }
}

dependencies {
    // APK decode/rebuild
    implementation 'org.apktool:apktool-lib:2.9.3'

    // Smali assemble/disassemble
    implementation 'org.smali:smali:2.5.2'
    implementation 'org.smali:baksmali:2.5.2'

    // DEX analysis (უკვე გვაქვს)
    implementation 'org.smali:dexlib2:2.5.2'

    // Guava (smali-ს სჭირდება)
    implementation 'com.google.guava:guava:31.1-android'

    // MultiDex
    implementation 'com.android.support:multidex:1.0.3'
}
